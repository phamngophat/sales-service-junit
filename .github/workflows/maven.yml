name: Sales Service Project (CI included) | © 2026

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package --file sales-service-junit/pom.xml

    - name: Distribute jar file
      run: mkdir staging && cp sales-service-junit/target/*.jar staging

    - name: Make hyperlink to jar file
      uses: actions/upload-artifact@v4
      with:
        name: sales-service-1.0
        path: staging
